# ============================================================
# Stage Radar — configuration
# Profil : stage de fin d'études M2 — Data Science / IA / ML / CV
# Zone : Île-de-France uniquement
# ============================================================

recherches:
  - keywords: "stage data scientist"
  - keywords: "stage intelligence artificielle"
  - keywords: "stage machine learning"
  - keywords: "stage computer vision NLP"

localisation:
  # "Île-de-France" est mal géocodé par LinkedIn (→ Bretagne !) : on centre sur Paris
  linkedin: "Paris, France"
  linkedin_rayon_miles: 25   # ~40 km autour de Paris ≈ Île-de-France
  # Garde-fou : une offre LinkedIn est rejetée si sa localisation ne contient
  # aucun de ces fragments (minuscules)
  linkedin_zones_ok:
    - "paris"
    - "île-de-france"
    - "ile-de-france"
    - "yvelines"
    - "essonne"
    - "hauts-de-seine"
    - "seine-saint-denis"
    - "val-de-marne"
    - "val-d'oise"
    - "seine-et-marne"
  wttj_state: "Île-de-France"          # facette offices.state de WTTJ

linkedin:
  # Croisière : 24h de fenêtre → le bassin tient dans results_par_requete,
  # rien n'échappe, et un run raté est rattrapé par les suivants (dédup ok).
  hours_old: 24
  results_par_requete: 50

wttj:
  results_par_requete: 30
  max_age_jours: 2   # ignorer les offres publiées il y a plus de N jours
  # Clés Algolia publiques du front WTTJ (lecture seule).
  # Si vides, le script tente de les découvrir automatiquement.
  # Pour les récupérer à la main : F12 sur welcometothejungle.com/fr/jobs
  # → onglet Réseau → filtre "algolia" → paramètres x-algolia-application-id
  # et x-algolia-api-key dans l'URL d'une requête.
  algolia_app_id: "CSEKHVMS53"
  algolia_api_key: "4bd8f6215d0cc52b26430765769e65a0"
  algolia_index: "wk_cms_jobs_production"   # index public des offres (vérifié)

scoring:
  # Score 0 (rejet) si AUCUN de ces mots n'apparaît dans le titre
  obligatoires_titre: ["stage", "stagiaire", "intern", "trainee"]

  # Score 0 si l'un de ces mots apparaît dans le titre (sauf si "stage" y est aussi)
  exclusions_titre: ["cdi", "senior", "confirmé", "freelance", "alternance"]

  # Mots-clés pondérés (présence dans le titre = poids double)
  bonus:
    "data scien": 20
    "machine learning": 20
    "deep learning": 20
    "computer vision": 20
    "vision par ordinateur": 20
    "nlp": 18
    "llm": 18
    "ia générative": 15
    "genai": 15
    "generative ai": 15
    "agent": 12
    "rag": 12
    "intelligence artificielle": 15
    "artificial intelligence": 15
    "ia": 12          # sigles : correspondance en mot entier uniquement
    "ai": 12
    "ml": 12
    "pytorch": 10
    "tensorflow": 8
    "python": 5
    "m2": 8
    "master 2": 8
    "bac+5": 8
    "fin d'études": 8
    "6 mois": 5

  # Seules les offres avec score >= seuil déclenchent un email
  seuil_notification: 30

notification:
  max_emails_par_run: 8   # au-delà, les offres restantes sont regroupées dans un email digest

llm:
  actif: true
  modele: "gemini-2.5-flash"
  lot: 10                    # offres par appel API
  max_offres_par_run: 40     # plafond budget : au-delà, fallback mots-clés
  profil: >
    Étudiant en Master 2 (Bac+5), cherche un STAGE DE FIN D'ÉTUDES d'environ
    6 mois en data science, intelligence artificielle, machine learning,
    deep learning, computer vision, NLP ou IA générative/LLM, en Île-de-France.
    Stack : Python, PyTorch. Les stages de recherche/R&D et pré-thèse sont
    pertinents. NON pertinents : alternance seule (sans stage), CDI/CDD,
    postes confirmés/seniors, sujets sans composante data/IA
    (marketing, juridique, communication, vente, finance pure).

sante:
  seuil_heures_ouvrees: 48   # alerte si un canal reste muet plus de 48h ouvrées
