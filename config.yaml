# ============================================================
# Stage Radar — configuration
# Profil : stage de fin d'études M2 — Data Science / IA / ML / CV
# Zone : Île-de-France uniquement
# ============================================================

# --- Sites carrières officiels (détection à la source, avant LinkedIn/WTTJ) ---
# Filtres côté site : stage pur + France. La géographie (IdF) et la pertinence
# sont tranchées par Gemini (le profil exige l'Île-de-France).
carrieres:
  actif: true
  max_descriptions_par_run: 15
  entreprises:
    renault: {actif: true}
    valeo: {actif: true}
    orange: {actif: true}

recherches:
  - keywords: "stage data scientist"
  - keywords: "stage intelligence artificielle"
  - keywords: "stage machine learning"
  - keywords: "stage computer vision NLP"
  - keywords: "stage embedded software robotique"   # cible secondaire

localisation:
  # "Île-de-France" est mal géocodé par LinkedIn (→ Bretagne !) : on centre sur Paris
  linkedin: "Paris, France"
  linkedin_rayon_miles: 25   # ~40 km autour de Paris ≈ Île-de-France
  # Garde-fou : une offre LinkedIn est rejetée si sa localisation ne contient
  # aucun de ces fragments (minuscules)
  linkedin_zones_ok:
    - "paris"
    - "île-de-france"
    - "ile-de-france"
    - "yvelines"
    - "essonne"
    - "hauts-de-seine"
    - "seine-saint-denis"
    - "val-de-marne"
    - "val-d'oise"
    - "seine-et-marne"
  wttj_state: "Île-de-France"          # facette offices.state de WTTJ

linkedin:
  # Croisière : 24h de fenêtre → le bassin tient dans results_par_requete,
  # rien n'échappe, et un run raté est rattrapé par les suivants (dédup ok).
  hours_old: 24
  results_par_requete: 50

wttj:
  results_par_requete: 30
  max_age_jours: 2   # ignorer les offres publiées il y a plus de N jours
  # Clés Algolia publiques du front WTTJ (lecture seule).
  # Si vides, le script tente de les découvrir automatiquement.
  # Pour les récupérer à la main : F12 sur welcometothejungle.com/fr/jobs
  # → onglet Réseau → filtre "algolia" → paramètres x-algolia-application-id
  # et x-algolia-api-key dans l'URL d'une requête.
  algolia_app_id: "CSEKHVMS53"
  algolia_api_key: "4bd8f6215d0cc52b26430765769e65a0"
  algolia_index: "wk_cms_jobs_production"   # index public des offres (vérifié)

scoring:
  # Score 0 (rejet) si AUCUN de ces mots n'apparaît dans le titre
  obligatoires_titre: ["stage", "stagiaire", "intern", "trainee"]

  # Score 0 si l'un de ces mots apparaît dans le titre (sauf si "stage" y est aussi)
  exclusions_titre: ["cdi", "senior", "confirmé", "freelance", "alternance"]

  # Mots-clés pondérés (présence dans le titre = poids double)
  bonus:
    "data scien": 20
    "machine learning": 20
    "deep learning": 20
    "computer vision": 20
    "vision par ordinateur": 20
    "nlp": 18
    "llm": 18
    "ia générative": 15
    "genai": 15
    "generative ai": 15
    "agent": 12
    "rag": 12
    "intelligence artificielle": 15
    "artificial intelligence": 15
    "ia": 12          # sigles : correspondance en mot entier uniquement
    "ai": 12
    "ml": 12
    "pytorch": 10
    "tensorflow": 8
    "python": 5
    "m2": 8
    "master 2": 8
    "bac+5": 8
    "fin d'études": 8
    "6 mois": 5

  # Seules les offres avec score >= seuil déclenchent un email
  seuil_notification: 30

notification:
  max_emails_par_run: 8   # au-delà, les offres restantes sont regroupées dans un email digest

llm:
  actif: true
  modele: "gemini-2.5-flash"
  lot: 10                    # offres par appel API
  max_offres_par_run: 40     # plafond budget : au-delà, fallback mots-clés
  profil: >
    Étudiant en Master 2 (Bac+5), cherche un STAGE DE FIN D'ÉTUDES d'environ
    6 mois dont le CŒUR DU SUJET est : data science, intelligence artificielle,
    machine learning, deep learning, computer vision, NLP ou IA générative/LLM,
    en Île-de-France. Stack : Python, PyTorch. Les stages de recherche/R&D et
    pré-thèse dans ces domaines sont pertinents.
    CIBLE SECONDAIRE (score 50-75, jamais plus) : stages en logiciel embarqué,
    robotique, systèmes temps réel ou edge AI, surtout dans des entreprises
    IA/deeptech/défense — intéressants mais moins prioritaires que le ML pur.
    RÈGLE DE SÉVÉRITÉ : si le sujet principal du stage n'est PAS le machine
    learning / la data science / l'IA, le score doit être INFÉRIEUR à 30, même
    si le niveau (M2), la durée et le lieu correspondent. Un stage technique ou
    scientifique n'est pas pertinent par défaut.
    NON pertinents (score < 30) : alternance seule (sans stage), CDI/CDD,
    postes confirmés/seniors ; simulation physique / électromagnétisme /
    mécanique / électronique / contrôle non destructif sans composante ML
    centrale ; développement logiciel pur (web, mobile, DevOps, data
    engineering pur) ; postes fonctionnels autour de la donnée sans
    modélisation : SIRH, administration d'outils (SAP, CRM...), data analyst
    fonctionnel / reporting BI / Excel, gestion de projet, UAT/testing ;
    marketing, juridique, communication, vente, finance pure, conseil en
    stratégie sans travail technique data/IA.

sante:
  seuil_heures_ouvrees: 48   # alerte si un canal reste muet plus de 48h ouvrées

linkedin_mail:
  # Canal "alertes email LinkedIn" : lit les emails d'alerte emploi reçus sur
  # Gmail (recommandations personnalisées de ton compte). Prérequis : avoir
  # créé des alertes emploi sur LinkedIn avec réception par email.
  actif: true
  expediteurs:
    - "jobalerts-noreply@linkedin.com"
    - "jobs-noreply@linkedin.com"
