name: Stage Radar scan

on:
  schedule:
    # Toutes les 30 min, de 05h à 21h UTC (~7h-23h Paris). Cron GitHub = UTC.
    - cron: "*/30 5-21 * * *"
  workflow_dispatch: {}   # bouton "Run workflow" pour tester à la main

permissions:
  contents: write   # nécessaire pour commiter state.json

concurrency:
  group: stage-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Commit state
        run: |
          git config user.name "stage-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "state: scan $(date -u +'%Y-%m-%d %H:%M')"
          # -X theirs : si un autre run a poussé entre-temps, on garde la version
          # de CE run en cas de conflit (state.json) ; historique.csv fusionne
          # par union via .gitattributes. Pire cas : une notification en double.
          git pull --rebase -X theirs origin main || { git rebase --abort; git pull --rebase -s ours origin main; }
          git push
